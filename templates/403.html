{% extends "error_base.html" %}
{% block title %}403 — Access Denied | Airline Analytics{% endblock %}
{% block content %}
<section class="section" style="padding-top:80px;min-height:70vh;display:flex;align-items:center">
  <div class="container">
    <div class="row justify-content-center text-center">
      <div class="col-lg-7">
        <div class="empty-state__art mx-auto mb-4" style="width:130px;height:130px;font-size:3rem;background:var(--grad-sunset)"><i class="bi bi-shield-lock"></i></div>
        <h1 class="display-2 fw-bold grad-text" style="letter-spacing:-.04em">403</h1>
        <h2 class="section-title mt-2 mb-3">This area is restricted</h2>
        <p class="section-sub mb-4" style="max-width:520px;margin-left:auto;margin-right:auto">
          You need to be signed in with an authorised account to view this page. Log in and try again.
        </p>
        <div class="d-flex flex-wrap gap-3 justify-content-center">
          <a href="/login/" class="btn btn-primary btn-lg magnetic"><i class="bi bi-box-arrow-in-right me-2"></i> Log in</a>
          <a href="/" class="btn btn-ghost btn-lg magnetic"><i class="bi bi-house-door me-2"></i> Return Home</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
